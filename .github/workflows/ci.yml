name: CI Validar y Testear

on:
  workflow_dispatch:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        working-directory: ./Despliegue-servicios-Administrados
        run: npm ci

      - name: Validar HTML (html-validate)
        working-directory: ./Despliegue-servicios-Administrados
        run: npx html-validate index.html

      - name: Linting CSS (stylelint)
        working-directory: ./Despliegue-servicios-Administrados
        run: npx stylelint "css/**/*.css"

      - name: Linting JavaScript (eslint)
        working-directory: ./Despliegue-servicios-Administrados
        run: npx eslint js/

      - name: Ejecutar tests unitarios
        working-directory: ./Despliegue-servicios-Administrados
        run: npm  test